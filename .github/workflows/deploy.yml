name: Publish LEAN Enabler

on:
  push:
    branches: [main]
    paths:
      - LEAN-GitHub-Pages.zip
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Get publication package
        uses: actions/checkout@v4
      - name: Unpack and verify site
        run: |
          unzip -q LEAN-GitHub-Pages.zip -d "$RUNNER_TEMP/site"
          test -f "$RUNNER_TEMP/site/github-pages/index.html"
          test -d "$RUNNER_TEMP/site/github-pages/assets"
          test -d "$RUNNER_TEMP/site/github-pages/lean-start"
      - name: Set up GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/site/github-pages
      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v4
